# The first build deploys 1.0; the second and third, with either deploy
# scope, find it deployed and deploy nothing; the fourth would add a NAR
# the repository doesn't have, and fails
invoker.goals.1 = clean deploy
invoker.profiles.1 = fresh
invoker.goals.2 = clean deploy
invoker.goals.3 = clean deploy
invoker.profiles.3 = other-primary
invoker.goals.4 = clean deploy
invoker.profiles.4 = add-static
invoker.buildResult.4 = failure
